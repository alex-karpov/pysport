name: Release

on:
  push:
    tags:
      - "v*"
      - "nightly"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64]
    name: Build on Windows ${{ matrix.architecture }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        id: set_up_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: ${{ matrix.architecture }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install python dependencies
        run: pip install uv && uv sync --frozen --extra win --extra gui
      - name: Build Rust extension
        run: uv run poe develop-rust
      - name: Generate mo files
        run: uv run poe generate-mo
      - name: Generate version file
        run: uv run poe generate-version
      - name: Build
        run: uv run python builder.py build
      - name: Generate MSI installer
        run: uv run python builder.py bdist_msi
      - name: Generate Inno Setup installer
        shell: pwsh
        run: |
          $version = (uv run python -c "from sportorg.config import VERSION; print(VERSION)").Trim()
          $numeric = [regex]::Match($version, '\d+\.\d+\.\d+').Value
          if (-not $numeric) { $numeric = '0.0.0' }
          $buildDir = (Get-ChildItem build -Directory -Filter 'exe.*' | Select-Object -First 1).FullName
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=$version" "/DMyVersionInfoVersion=$numeric.0" "/DBuildDir=$buildDir" sportorg.iss
      - name: Generate portable archive
        shell: pwsh
        run: |
          $version = (uv run python -c "from sportorg.config import VERSION; print(VERSION)").Trim()
          $buildDir = (Get-ChildItem build -Directory -Filter 'exe.*' | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$buildDir\*" -DestinationPath "dist\SportOrg-$version-portable.zip" -Force
      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          path: |
            dist/*.msi
            dist/*.exe
            dist/*.zip
          name: ${{ runner.os }}-${{ matrix.architecture }}
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          make_latest: ${{ github.ref_name != 'nightly' }}
          files: |
            dist/*.msi
            dist/*.exe
            dist/*.zip
